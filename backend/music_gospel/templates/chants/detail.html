{% extends "base.html" %}

{% block title %}lyrics de {{chant.titre}} {% endblock title %}
{% block head %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        @media (max-width: 1200px) {
        body {
            overflow: auto; 
        }
        }
        body {
            background-color: #e8e2e2;
            color: rgb(78, 76, 76);
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.05);
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px; 
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: purple;
            letter-spacing: 2px;
            animation: pulseLogo 5s infinite ease-in-out;
            display:inline-block;
        }
        .w3-spin {
            display: inline-block;
            font-size: 26px;
            line-height: 1; 
            animation: rotation-infinie 4s infinite linear;
            cursor: pointer;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); color: #800080; }
        }
        nav a {
            color: purple;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.5s;
            padding-bottom: 5px;
            position: relative;
        }
        nav a:hover {
            color:black ;
        }
        nav a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: purple;
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }
        nav a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        nav a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
    </style>
{% endblock head %}
{% block body %}

<p class='lyric'>
    {{chant.paroles}}
</p>
{% endblock body %}
</html>
