<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #e8e2e2;
            color: #181818;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 42px;
            font-weight: bold;
            color: purple;
            letter-spacing: 2px;
        }
        header p {
            color: purple;
            font-size: 14px;
            margin-top: 5px;
        }
        form{
            background-color: white;
            padding: 50px;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #181818;
            font-weight: bold;
            font-size: 14px;
        }
        input{
            width: 100%;
            padding: 12px 15px;
            border: 2px solid  #e8e2e2;
            
        }

    </style>
</head>
<body>
    <!--Créer un compte-->
    <header>
        <h1>AGLY</h1>
        <p><Strong>African muscic gospel lyrics</Strong></p>
    </header>
    <form method="POST">
        {% csrf_token %}
            <div>
                <div class="form-group">
                <label for="Nom">Nom d'utilisateur</label>
                <input type="text" id="Nom" name="username" placeholder="Mettez un nom d'utilisateur" required>
            </div><br>
            <div>
                <label for="email">Adresse Email</label>
                <input type="email" id="email" name="email" placeholder="Ex: votremail@gmail.com" required>
            </div><br>
            <div>
                <label for="password">Mot de passe</label>
                <input type="password" id="Mot de passe" name="password" placeholder="Créez un mot de passe " required>
            </div><br>
            <button type="submit">Créer mon compte</button>
            
            <p>Déjà un compte ? <button type="submit">Se connecter</button></p>
        </form> 
        <!--Pied de page-->
    <footer>
        &copy; 2026 AMGL - African Music Gospel Lyrics. Tous droits réservés.
    </footer>

</body>
</html>
