<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #e8e2e2;
            color: #181818;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 42px;
            font-weight: bold;
            color: purple;
            letter-spacing: 2px;
        }
        header p {
            color: purple;
            font-size: 14px;
            margin-top: 5px;
        }
        form{
            background-color: white;
            padding: 50px;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #181818;
            font-weight: bold;
            font-size: 14px;
        }
        input{
            width: 100%;
            padding: 12px 15px;
            border: 2px solid  #e8e2e2;
            
        }
        input:focus {
            border-color: purple;
            box-shadow: 0 0 8px rgba(128, 0, 128, 0.1);
        }
        button{
            width: 100%;
            color: white;
            background-color: purple;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #800080;
            transform: scale(1.02);
        }
        .button-link {
            background: none;
            border: none;
            color: rgb(118, 109, 118);
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
            margin-left: 5px;
            padding: 0;
        }
        .button-link:hover {
            color: black;
            text-decoration: underline;
        }
        footer {
            color: #800080;
            font-size: 12px;
            text-align: center;
            margin-top: 40px;
        }
        .buttonconnexion{
            background-color: transparent;
            color:black;
            text-decoration: underline;
            font-weight: 100;
        }
        .conteneur{
            /*border:2px solid black;*/
            margin-top: 9px;
            padding-left: 15px;
            display: flex;
            flex-direction: row;
            gap: 3px;
        }
        .bouton-bas{
            margin-top:6px;
            margin-bottom:15px;
            padding:5px;
        }

    </style>
</head>
<body>
    <!--Créer un compte-->
    <header>
        <h1>AGLY</h1>
        <p><Strong>African muscic gospel lyrics</Strong></p>
    </header>
    <form method="POST">
        {% csrf_token %}        
            <div>
                <label for="email">Adresse Email ou Pseudonyme</label>
                <input type="text" id="email" name="valeur" placeholder="Ex: votremail@gmail.com" value="{{form.valeur.value|default:''}}" required>
            </div><br>
             <div>
                <label for="password">Mot de passe</label>
                <input type="password" id="Mot de passe" class='password' name=password placeholder="Créez un mot de passe" value="{{form.password.value|default:''}}" required>
            </div><br>
            {{message}}
            <button type="submit" class='bouton-bas'>Se connecter</button>
            <p >Vous n'avez pas de compte ?<a class='bouton-bas' href="{% url 'inscription' %}" > S'Inscrire</a></p>

        </form> 
            
        <!--Pied de page-->
    <footer>
        &copy; 2026 AMGL - African Music Gospel Lyrics. Tous droits réservés.
    </footer>

</body>
</html>
