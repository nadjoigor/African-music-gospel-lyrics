<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - AGLY</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #e8e2e2;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: purple;
            letter-spacing: 2px;
            animation: pulseLogo 3s infinite ease-in-out;
        }
        
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); color: #800080; }
        }

        nav a {
            color: purple;
            text-decoration: none;
            margin-left: 20px;
            position: relative;
            padding-bottom: 5px;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: black;
        }
        nav a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: purple;
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }
        nav a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        nav a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        .hero {
            text-align: center;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .image {
            border-radius: 20px;
            overflow: hidden;
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: bounceIn 1.2s ease-out;
        }
        .image img {
            display: block;
            object-fit: cover;
            border-radius: 20px;
        }
        .image:hover {
            transform: scale(1.04) translateY(-10px);
            box-shadow: 0 20px 40px rgba(128, 0, 128, 0.2);
        }

        /* ========================================================
           NOUVELLES ANIMATIONS POUR LES TEXTES DU BAS
           ======================================================== */
        
        /* Titre H1 : Apparition en fondu + Montée */
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #181818;
            font-weight: 800;
            display: inline-block;
            animation: fadeInUp 1s ease-out 0.3s both, textWave 4s ease-in-out infinite alternate;
            transition: color 0.3s ease, transform 0.3s ease;
            cursor: default;
        }

        /* Effet au survol du grand titre */
        .hero h1:hover {
            color: purple;
            transform: scale(1.02);
        }

        /* Paragraphe : Apparition différée (effet cascade) + Écartement des lettres au survol */
        .hero p {
            color: #555555;
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
            /* Commence l'apparition après le titre (0.6s de délai) */
            animation: fadeInUp 1s ease-out 0.6s both;
            transition: all 0.4s ease;
        }

        /* Effet interactif au survol du paragraphe */
        .hero p:hover {
            color: #181818;
            letter-spacing: 0.5px; /* Le texte s'étire légèrement en douceur */
        }

        /* Keyframes existants et nouveaux */
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 0.8; }
            70% { transform: scale(0.9); opacity: 0.9; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 30px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        /* Animation continue de balancement/onde pour le titre */
        @keyframes textWave {
            0% { transform: translateY(0); }
            100% { transform: translateY(-4px); }
        }

    </style>
</head>
<body>

    <!-- En-tête -->
    <header>
        <div class="logo">AGLY</div>
        <nav>
            <a href="titres.html">Titres</a>
            <a href="favoris.css">Favoris</a>
            <a href="profil.html">Profil</a>
            <a href="recherche.html">Rechercher</a>
        </nav>
    </header>

    <!-- Zone Héros -->
    <div class="hero">
        <div class="image">
            <img src="images/image.png" alt="photo de profil" width="400px" height="400px">
        </div>
        <section>
            <h1>Vibrez au rythme de la musique</h1>
            <p>Découvrez, écoutez et partagez vos chansons gospels préférées en illimité.</p>
        </section>
    </div>

</body>
</html>
