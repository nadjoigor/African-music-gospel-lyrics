<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compte</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #e8e2e2;
            color: #181818;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 42px;
            font-weight: bold;
            color: purple;
            letter-spacing: 2px;
        }
        header p {
            color: purple;
            font-size: 14px;
            margin-top: 5px;
        }
        form{
            background-color: white;
            padding: 50px;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #181818;
            font-weight: bold;
            font-size: 14px;
        }
        input{
            width: 100%;
            padding: 12px 15px;
            border: 2px solid  #e8e2e2;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: purple;
            box-shadow: 0 0 8px rgba(128, 0, 128, 0.1);
        }
        button{
            width: 100%;
            color: white;
            background-color: purple;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #800080;
            transform: scale(1.02);
        }
        .button-link {
            background: none;
            border: none;
            color: rgb(118, 109, 118);
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
            margin-left: 5px;
            padding: 0;
        }
        .button-link:hover {
            color: black;
            text-decoration: underline;
        }
        footer {
            color: #800080;
            font-size: 12px;
            text-align: center;
            margin-top: 40px;
        }
        .buttonconnexion{
            background-color: transparent;
            color:black;
            font-weight: 100;
        }
        .conteneur{
            
            margin-top: 9px;
            padding-left: 15px;
            display: flex;
            flex-direction: row;
            gap: 3px;
        }
        .creer-mon-compte{
            background-color: #800080;
            color:black;
            font-weight: 100;
            border-radius: 8px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <!--Créer un compte-->
    <header>
        <h1>AGLY</h1>
        <p><Strong>African muscic gospel lyrics</Strong></p>
    </header>
    <form>
            <div>
                <div class="form-group">
                <label for="Nom">Nom d'utilisateur</label>
                <input type="text" id="Nom" placeholder="Mettez un nom d'utilisateur" required>
            </div><br>
            <div>
                <label for="email">Adresse Email</label>
                <input type="email" id="email" placeholder="Ex: votremail@gmail.com" required>
            </div><br>
            <div>
                <label for="Mot de passe">Mot de passe</label>
                <input type="Mot de passe" id="Mot de passe" placeholder="Créez un mot de passe " required>
            </div><br>
            <div class="button-link">
                <button type="submit">Créer mon compte</button>
            </div>
            <div class="conteneur">
                <p>Déjà un compte ?</p> <a class="creer-mon-compte" href="se connecter.html">Se connecter</a>
            </div>
        </form> 

    <footer>
        &copy; 2026 AMGL - African Music Gospel Lyrics. Tous droits réservés.
    </footer>

</body>
</html>
