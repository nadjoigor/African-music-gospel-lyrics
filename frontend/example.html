:root {
  --primary: #6A1B9A; /* Violet gospel */
  --accent: #FFB300;  /* Or */
  --bg: #F5F5F5;
  --text: #212121;
}
.body{ margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

body { background: var(--bg); color: var(--text); }

header {
  background: linear-gradient(135deg, var(--primary), #8E24AA);
  color: white;
  text-align: center;
  padding: 2rem 1rem;
}
header input {
  width: 90%;
  max-width: 500px;
  padding: 12px;
  border-radius: 25px;
  border: none;
  margin-top: 1rem;
  font-size: 16px;
}

.song-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 1rem;
  padding: 2rem;
}

.song-card {
  background: white;
  border-radius: 12px;
  padding: 1rem;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.2s;
}
.song-card:hover { transform: translateY(-5px); }
.song-card img { width: 100%; border-radius: 8px; }

#lyricsPage { padding: 2rem; max-width: 800px; margin: auto; }
.song-header { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
.song-header img { width: 200px; border-radius: 12px; }
.lyrics-box { background: white; padding: 1.5rem; border-radius: 12px; white-space: pre-wrap; }
.lyrics-box pre { font-size: 18px; line-height: 1.8; }
#copyBtn, #backBtn {
  background: var(--primary); color: white; border: none; padding: 8px 16px;
  border-radius: 8px; cursor: pointer; margin-bottom: 1rem;
}
.hidden { display: none; }

footer { text-align: center; padding: 2rem; color: #777; }

@media(max-width: 600px){
  .song-header { flex-direction: column; align-items: center; text-align: center; }}

    </style>

        const songList = document.getElementById('songList');
        const searchBar = document.getElementById('searchBar');
        const lyricsPage = document.getElementById('lyricsPage');
        const results = document.getElementById('results');

        function displaySongs(filteredSongs) {
        songList.innerHTML = '';
        filteredSongs.forEach(song => {
            const card = `
            <div class="song-card" onclick="showLyrics(${song.id})">
                <img src="${song.cover}" alt="${song.title}">
                <h3>${song.title}</h3>
                <p>${song.artist} - ${song.country}</p>
            </div>
            `;
            songList.innerHTML += card;
        });
        }

        searchBar.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = songs.filter(song => 
            song.title.toLowerCase().includes(term) || 
            song.artist.toLowerCase().includes(term) ||
            song.lyrics.toLowerCase().includes(term) ||
            song.country.toLowerCase().includes(term)
        );
        displaySongs(filtered);
        });

        function showLyrics(id) {
        const song = songs.find(s => s.id === id);
        document.getElementById('songTitle').innerText = song.title;
        document.getElementById('songArtist').innerText = song.artist;
        document.getElementById('songCover').src = song.cover;
        document.getElementById('songLyrics').innerText = song.lyrics;
        document.getElementById('youtubePlayer').src = song.youtube;
        
        results.classList.add('hidden');
        lyricsPage.classList.remove('hidden');
        window.scrollTo(0,0);
        }

        document.getElementById('backBtn').addEventListener('click', () => {
        lyricsPage.classList.add('hidden');
        results.classList.remove('hidden');
        document.getElementById('youtubePlayer').src = ""; // stop la vidéo
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
        const lyrics = document.getElementById('songLyrics').innerText;
        navigator.clipboard.writeText(lyrics);
        alert('Paroles copiées !');
        });
