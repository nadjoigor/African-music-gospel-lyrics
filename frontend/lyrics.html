<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titres</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .lyrics-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin: 10px;
            padding: 15px;
            flex: 1 1 calc(30% - 20px); /* Trois cartes par ligne */
            position: relative;
        }

        .favorite {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
        }
        .search-container { 
            max-width: 600px; 
            margin: 0 auto;
            display: flex; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            border-radius: 10px; overflow: hidden;
            padding: 10px; 
        }
        input { 
            flex: 1; 
            padding: 15px 25px; 
            border: none; 
            font-size: 16px; 
            outline: none; 
            display: flex;
            justify-content: space-between;
        }
        #searchButton { 
            padding: 15px 30px; 
            border: none;
            border-radius: 8px; 
            background-color: #319795; 
            color: white; 
            font-size: 16px; 
            cursor: pointer; transition: 0.2s; 
        }
        #searchButton:hover { 
            background-color: #2c7a7b; 
        }
        


    </style>
</head>
<body>
    <header>
        
    </header>
    <div class="search-container">
    <input type="text" id="search-container" placeholder="Rechercher un titre, artiste, parole..."><button id="searchButton">Rechercher</button></div>
        <h1>Lyrics</h1>
        <div id="conteneurlyrics" ></div>
        <script>
            const songs = [
                { title: "Chanson 1", lyrics: "Voici les paroles de la chanson 1..." },
                { title: "Chanson 2", lyrics: "Voici les paroles de la chanson 2..." },
                { title: "Chanson 3", lyrics: "Voici les paroles de la chanson 3..." }
            ];

            const lyricsContainer = document.getElementById('lyrics-container');

            songs.forEach((song, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="favorite" onclick="toggleFavorite(${index})">★</div>
                    <h2>${song.title}</h2>
                    <p>${song.lyrics}</p>
                `;
                lyricsContainer.appendChild(card);
            });

            function toggleFavorite(index) {
                const favoriteIcon = document.querySelectorAll('.favorite')[index];
                favoriteIcon.classList.toggle('fav');
            }
        </script>
</body>
</html>
