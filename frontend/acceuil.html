<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceuil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #e8e2e2;
            color: #ffffff;
            line-height: 1.6;
            overflow: hidden;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: purple;
            letter-spacing: 2px;
            animation: pulseLogo 5s infinite ease-in-out;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); color: #800080; }
        }
        nav a {
            color: purple;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.5s;
            padding-bottom: 5px;
            position: relative;
        }
        nav a:hover {
            color:black ;
        }
        nav a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: purple;
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }
        nav a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        nav a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
        .hero {
            text-align: center;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px
        }
        .image {
            border-radius: 20px;
            overflow: hidden;
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: bounceIn 1.2s ease-out;
        }
        .image img {
            display: block;
            object-fit: cover;
            border-radius: 20px;
        }
        .image:hover {
            transform: scale(1.04) translateY(-10px);
            box-shadow: 0 20px 40px rgba(128, 0, 128, 0.2);
        }
        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #181818;
        }
        p {
            color: #181818;
        }

    </style>
</head>
<body>
    <!-- En-tête -->
    <header>
        <div class="logo">AGLY</div>
        <nav>
            <a href="titres.html">Titres</a>
            <a href="favoris.html">Favoris</a>
            <a href="profil.html">Profil</a>
            <a href="recherche.html">Rechercher</a>
        </nav>
    </header>
    <div class="hero">
        <div class="image"><img src="images/image.png" alt="photo de profil" width="400px" height="400px"></div>
        <section>
            <h1>Vibrez au rythme de la musique</h1>
            <p>Découvrez, écoutez et partagez vos chansons gospels préférées en illimité.</p>
        </section>
    </div>
    

</body>
</html>
