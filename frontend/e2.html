<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMGL - Bienvenue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.95)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            padding: 30px 50px;
            display: flex;
            justify-content: center;
        }

        .logo-sigle {
            font-size: 32px;
            font-weight: 900;
            color: #ff9f43;
            letter-spacing: 2px;
        }

        .auth-card {
            max-width: 450px;
            width: 90%;
            margin: 20px auto;
            background: rgba(30, 30, 30, 0.85);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 159, 67, 0.2);
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .auth-card h1 {
            font-size: 24px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .auth-card p {
            color: #b3b3b3;
            margin-bottom: 25px;
            font-size: 14px;
        }

        /* Gestion de l'affichage des formulaires */
        .auth-form {
            display: none; /* Caché par défaut */
        }

        .auth-form.active {
            display: block; /* Affiché quand actif */
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ff9f43;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: #262626;
            border: 2px solid transparent;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: #ff9f43;
            background: #333333;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #ff9f43, #ff5252);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 82, 82, 0.4);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

        /* Liens de bascule et options */
        .toggle-text {
            margin-top: 20px;
            font-size: 14px;
            color: #b3b3b3;
        }

        .toggle-link {
            color: #ff9f43;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .forgot-password {
            display: block;
            margin-top: 15px;
            font-size: 13px;
            color: #777;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-password:hover {
            color: #ff5252;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-sigle">AMGL</div>
    </header>

    <div class="auth-card">
        <h1>Élevez votre âme au rythme du Gospel Africain</h1>
        <p>Rejoignez-nous pour écouter, chanter et accéder aux paroles de vos chants de louange préférés.</p>
        
        <!-- FORMULAIRE 1 : CRÉER UN COMPTE (Actif par défaut) -->
        <form id="register-form" class="auth-form active">
            <div class="form-group">
                <label for="reg-username">Nom d'utilisateur</label>
                <input type="text" id="reg-username" placeholder="Choisissez un identifiant" required>
            </div>
            <div class="form-group">
                <label for="reg-email">Adresse Email</label>
                <input type="email" id="reg-email" placeholder="Ex: votremail@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="reg-password">Mot de passe</label>
                <input type="password" id="reg-password" placeholder="Créez un mot de passe sécurisé" required>
            </div>
            <button type="submit" class="btn-submit">Créer mon compte</button>
            
            <p class="toggle-text">Déjà un compte ? <span class="toggle-link" onclick="switchForm('login')">Se connecter</span></p>
        </form>

        <!-- FORMULAIRE 2 : SE CONNECTER (Caché au départ) -->
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="login-username">Identifiant ou Email</label>
                <input type="text" id="login-username" placeholder="Votre identifiant ou email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" placeholder="Votre mot de passe" required>
            </div>
            <button type="submit" class="btn-submit">Entrer dans la louange</button>
            
            <p class="toggle-text">Nouveau ici ? <span class="toggle-link" onclick="switchForm('register')">Créer un compte</span></p>
            <a class="forgot-password" onclick="handleForgotPassword()">Mot de passe oublié ?</a>
        </form>
    </div>

    <footer>
        &copy; 2026 AMGL - African Music Gospel Lyrics. Tous droits réservés.
    </footer>

    <script>
        // Redirige directement si l'utilisateur possède déjà son ticket d'accès
        if (localStorage.getItem("isUserAuthenticated") === "true") {
            window.location.href = "chansons.html";
        }

        // Fonction pour basculer d'un formulaire à l'autre sans recharger la page
        function switchForm(formType) {
            const registerForm = document.getElementById('register-form');
            const loginForm = document.getElementById('login-form');

            if (formType === 'login') {
                registerForm.classList.remove('active');
                loginForm.classList.add('active');
            } else {
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
            }
        }

        // Soumission du formulaire d'inscription
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('reg-username').value;
            
            // Simulation : On enregistre le compte et on connecte directement l'utilisateur
            alert(`Compte créé avec succès ! Bienvenue ${username}.`);
            localStorage.setItem("isUserAuthenticated", "true");
            window.location.href = "chansons.html";
        });

        // Soumission du formulaire de connexion
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Simulation : valide n'importe quelle saisie pour l'exercice
            localStorage.setItem("isUserAuthenticated", "true");
            window.location.href = "chansons.html";
        });

        // Gestion du lien Mot de passe oublié
        function handleForgotPassword() {
            alert("Un lien de réinitialisation vous sera envoyé. (Cette fonctionnalité nécessite un serveur en arrière-plan)");
        }
    </script>

</body>
</html>
