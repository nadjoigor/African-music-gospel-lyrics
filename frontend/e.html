<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titres - AMGL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #e8e2e2;
            color: #181818;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: white;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.05);
        }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo { font-size: 24px; font-weight: bold; color: purple; letter-spacing: 2px; }
        nav a { color: purple; text-decoration: none; margin-left: 20px; }

        /* Conteneur principal */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            color: purple;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Liste des chants */
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Ligne d'un chant (Le modèle pour Django) */
        .song-item {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .song-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(128, 0, 128, 0.1);
        }

        /* Infos du chant */
        .song-details {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .song-icon {
            font-size: 28px;
        }
        .song-title {
            font-size: 18px;
            font-weight: bold;
            color: #181818;
            margin-bottom: 4px;
        }
        .song-artist {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        /* Badges pour les thèmes et langues (Champs 'theme' et 'langue' de Django) */
        .badges {
            display: flex;
            gap: 8px;
        }
        .badge {
            font-size: 11px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }
        .badge-theme {
            background-color: rgba(128, 0, 128, 0.1);
            color: purple;
        }
        .badge-langue {
            background-color: #eee;
            color: #333;
        }

        /* Groupe de boutons d'action (Champs 'paroles' et 'lien' de Django) */
        .song-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-paroles {
            background-color: purple;
            color: white;
        }
        .btn-paroles:hover { background-color: #5a005a; }
        
        .btn-video {
            background-color: #ff0000;
            color: white;
        }
        .btn-video:hover { background-color: #cc0000; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container"><div class="logo">AGLY</div></div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="titres.html">Titres</a>
        </nav>
    </header>

    <div class="container">
        <h1>Tous les Chants Gospel</h1>

        <div class="songs-list">
            
            <!-- Exemple 1 : Correspond au modèle avec un lien vidéo -->
            <div class="song-item">
                <div class="song-details">
                    <div class="song-icon">🎵</div>
                    <div class="song-info">
                        <div class="song-title">Way Maker</div>
                        <div class="song-artist">Sinach</div>
                        <div class="badges">
                            <span class="badge badge-theme">Adoration</span>
                            <span class="badge badge-langue">Anglais (eng)</span>
                        </div>
                    </div>
                </div>
                <div class="song-actions">
                    <!-- Ce bouton servira à ouvrir une page ou un popup avec le champ 'paroles' -->
                    <a href="#" class="btn btn-paroles">Voir Paroles</a>
                    <!-- Ce bouton utilise le champ 'lien' (Ex: YouTube) -->
                    <a href="https://youtube.com..." target="_blank" class="btn btn-video">Vidéo</a>
                </div>
            </div>

            <!-- Exemple 2 : Correspond au modèle SANS lien vidéo (Le bouton vidéo disparaît) -->
            <div class="song-item">
                <div class="song-details">
                    <div class="song-icon">🎵</div>
                    <div class="song-info">
                        <div class="song-title">Je loue ton saint nom</div>
                        <div class="song-artist">Chorale AMGL</div>
                        <div class="badges">
                            <span class="badge badge-theme">Louange</span>
                            <span class="badge badge-langue">Français (fra)</span>
                        </div>
                    </div>
                </div>
                <div class="song-actions">
                    <a href="#" class="btn btn-paroles">Voir Paroles</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
