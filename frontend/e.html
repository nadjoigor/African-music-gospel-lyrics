<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody - Accueil</title>
    <style>
        /* Styles CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: #181818;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #1db954;
        }

        nav a {
            color: #b3b3b3;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffffff;
        }

        /* Style spécial pour mettre en valeur les Favoris */
        nav a.favoris-link {
            color: #ff416c;
        }
        nav a.favoris-link:hover {
            color: #ff4b2b;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://picsum.photos') no-repeat center center/cover;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #b3b3b3;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #1db954;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #1ed760;
        }

        .player-section {
            max-width: 600px;
            margin: 50px auto;
            background: #181818;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .player-section h3 {
            margin-bottom: 15px;
        }

        #play-btn {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #0d0d0d;
            color: #777;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- En-tête -->
    <header>
        <div class="logo">Melody</div>
        <nav>
            <a href="#">Accueil</a>
            <a href="#">Titres</a>
            <a href="#">Artistes</a>
            <a href="#" class="favoris-link">❤️ Favoris</a>
            <a href="#">Rechercher</a>
        </nav>
    </header>

    <!-- Section principale (Hero) -->
    <section class="hero">
        <h1>Vibrez au rythme de la musique</h1>
        <p>Découvrez, écoutez et partagez vos chansons préférées en illimité.</p>
        <button class="btn" id="discover-btn">Explorer les nouveautés</button>
    </section>

    <!-- Section Lecteur Audio Interactif -->
    <section class="player-section">
        <h3>Titre du moment : "Songe d'été"</h3>
        <p id="track-status" style="margin-bottom: 15px; color: #b3b3b3;">En pause</p>
        <button id="play-btn">Lecture</button>
    </section>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2026 Melody. Tous droits réservés.</p>
    </footer>

    <!-- Script JavaScript -->
    <script>
        const playBtn = document.getElementById('play-btn');
        const trackStatus = document.getElementById('track-status');
        const discoverBtn = document.getElementById('discover-btn');
        const favorisLink = document.querySelector('.favoris-link');

        let isPlaying = false;

        // Gestion du bouton lecture/pause
        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                trackStatus.textContent = 'Lecture en cours... 🎶';
                playBtn.textContent = 'Pause';
            } else {
                trackStatus.textContent = 'En pause';
                playBtn.textContent = 'Lecture';
            }
        });

        // Alerte interactive sur le bouton principal
        discoverBtn.addEventListener('click', () => {
            alert('Bienvenue ! Les dernières nouveautés arrivent bientôt.');
        });

        // Alerte interactive sur l'onglet Favoris (pour simulation)
        favorisLink.addEventListener('click', (e) => {
            e.preventDefault();
            alert('Vous devez créer une playlist pour voir vos Favoris.');
        });
    </script>

</body>
</html>
