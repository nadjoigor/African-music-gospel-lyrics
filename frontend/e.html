<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - AGLY</title>
    <style>
        /* 1. RÈGLES DE BASE (Mêmes polices et fond que l'accueil) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #e8e2e2; /* Fond gris clair identique */
            color: #181818;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 2. EN-TÊTE */
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 42px;
            font-weight: bold;
            color: purple; /* Violet de votre marque */
            letter-spacing: 2px;
        }
        header p {
            color: #555555;
            font-size: 14px;
            margin-top: 5px;
        }

        /* 3. LE FORMULAIRE (Effet boîte blanche flottante) */
        form {
            background-color: white;
            padding: 40px;
            border-radius: 20px; /* Coins arrondis comme votre image */
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.08); /* Ombre douce */
            width: 100%;
            max-width: 400px; /* Largeur maximale de la boîte */
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #181818;
            font-weight: bold;
            font-size: 14px;
        }

        /* Styles des champs de saisie */
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e8e2e2;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        /* Effet visuel quand on clique dans un champ */
        input:focus {
            border-color: purple;
            box-shadow: 0 0 8px rgba(128, 0, 128, 0.1);
        }

        /* 4. LES BOUTONS ANIMÉS */
        button[type="submit"] {
            width: 100%;
            background-color: purple;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px;
        }
        /* Effet de survol sur le bouton principal */
        button[type="submit"]:hover {
            background-color: #800080;
            transform: scale(1.02);
        }

        /* Zone de bascule en bas de formulaire */
        .switch-account {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #555555;
        }
        /* Bouton "Se connecter" transformé en lien discret */
        .btn-link {
            background: none;
            border: none;
            color: purple;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
            margin-left: 5px;
        }
        .btn-link:hover {
            color: black;
            text-decoration: underline;
        }

        /* 5. PIED DE PAGE */
        footer {
            color: #800080;
            font-size: 12px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- En-tête -->
    <header>
        <h1>AGLY</h1>
        <p><strong>African Music Gospel Lyrics</strong></p>
    </header>

    <!-- Formulaire lié à index.html (votre page d'accueil) -->
    <form action="index.html">
        <div class="form-group">
            <label for="Nom">Nom d'utilisateur</label>
            <input type="text" id="Nom" placeholder="Choisissez un nom d'utilisateur" required>
        </div>
        
        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" placeholder="Ex: votremail@gmail.com" required>
        </div>
        
        <div class="form-group">
            <label for="Mot-de-passe">Mot de passe</label>
            <!-- Corrigé le type en "password" pour masquer les caractères à l'écran -->
            <input type="password" id="Mot-de-passe" placeholder="Créez un mot de passe" required>
        </div>
        
        <!-- Ce bouton valide les champs et envoie vers index.html grâce à l'action du formulaire -->
        <button type="submit">Créer mon compte</button>
        
        <div class="switch-account">
            Déjà un compte ? 
            <!-- Ce bouton redirige directement vers l'accueil sans forcer le remplissage des champs -->
            <button type="button" class="btn-link" onclick="window.location.href='index.html'">Se connecter</button>
        </div>
    </form> 

    <!-- Pied de page -->
    <footer>
        &copy; 2026 AMGL - African Music Gospel Lyrics. Tous droits réservés.
    </footer>

</body>
</html>
