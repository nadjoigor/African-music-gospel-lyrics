<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
    }

    .Info {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(12, 11, 11, 0.1);
    }
    .Info2{
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(12, 11, 11, 0.1);
        margin-top: 10px;    
    }

    h1,h2 {
        color: #333;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .bouton {
        display: flex;
        justify-content: space-between;
    }
    .bouton1{
        background-color: #b44eb4;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        border: none;
        color: white;
    }

    button:hover {
        background-color: #459aa0;
        transform: translateY(-5px);
    }
    .profil {
        text-align: center;
    }

    .profilphoto {
        width: 150px;
        height: 150px;
        border-radius: 50%; 
        object-fit: cover; 
        border: 1px solid #be33f5;
        background: #ddd;
        cursor: pointer;
        transition: 0.3s;
        margin-bottom: 17px;
    }


    .choix {
        margin-top: 10px;
        padding: 10px 20px;
        background: #be33f5;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .choix:hover {
        background: #0d65d9;
        transition-duration: 0.3s;
    }

    input[type="file"] {
        display: none; 
    }
    </style>

</head>
<body>
    <header>
        <div class="logo">AGLY</div>
                <nav>
                    <div class="lien"><a href="acceuil.html">Accueil</a></div>
                    <div class="lien"><a href="titres.html">Titres</a></div>
                    <div class="lien"><a href="favoris.html">Favoris</a></div>
                    <div class="lien"><a href="profil.html">Profil</a></div>
                    <div class="lien"><a href="recherche.html">Rechercher</a></div>
                </nav>
    </header>
    <div class="Info">
        <h1>Mon Profil</h1>
        <div class="profilInfo">
            <div class="profil">
                <img src="https://via.placeholder.com/150" alt="Photo de profil" class="profilphoto" id="preview">
                <br>
                <label for="fileInput" class="choix">Choisir une photo</label>
                <input type="file" id="fileInput" accept="image/*">
            </div>
                <h3>Nom: </h3><p>Jean Dupont</p>
                <h3>Email:</h3><p>Jean@example.com</p>
                <h3>Eglise:</h3><p>Saint Jean de Dieu</p>
                <div class="bouton">
                    <button class="bouton1" onclick="editProfile()">Modifier</button>
                    <button class="bouton1" onclick="deconnected()">Se deconnecter</button>
                </div>
            </div>
    </div>
    <div class="Info2">
        <h2>Mes Favoris</h2>
        <ul id="favorites-list">
            <li>Lyric 1</li>
            <li>Lyric 2</li>
            <li>Lyric 3</li>
        </ul>
        <button class="bouton1" onclick="clearFavorites()">Vider les favoris</button>
    </div>
    <script>
        function editProfile() {
            alert('Fonction de modification en cours de développement.');
        }
        function deconnected(){
            alert('Deconnection.');
        }
    
    
        function clearFavorites() {
            document.getElementById('favorites-list').innerHTML = '';
            alert('Vos favoris ont été vidés.');
        }
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');

        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result; // affiche l'image choisie
            }
            reader.readAsDataURL(file);
            }
        });

        // Cliquer sur l'image ouvre aussi le sélecteur
        preview.addEventListener('click', () => fileInput.click());
</script>
    </script>
</body>
</html>
